<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bank Transfer System Dashboard</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 30px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 10px; margin-bottom: 20px; }
        .header-title { color: #0d6efd; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col">
                <h1 class="header-title">🏦 Bank Transfer System Dashboard</h1>
                <p class="text-muted">Task 9: Live Application & Transaction Management</p>
            </div>
        </div>

        <!-- Customer Balances Table -->
        <div class="card p-4">
            <h3>Customer Accounts</h3>
            <table class="table table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Account Number</th>
                        <th>Name</th>
                        <th>Balance (LKR)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="customer : ${customers}">
                        <td th:text="${customer.id}">1</td>
                        <td th:text="${customer.accountNumber}">ACC001</td>
                        <td th:text="${customer.fullName}">Kamal</td>
                        <td th:text="${customer.balance}">50000.00</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Transfer Form Card -->
        <div class="card p-4">
            <h3>Make a Fund Transfer</h3>
            <form action="/transfer-form" method="post" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">Sender Account Number</label>
                    <input type="text" name="senderAccountNumber" class="form-control" required placeholder="e.g. 100001">
                </div>
                <div class="mb-3">
                    <label class="form-label">Receiver Account Number</label>
                    <input type="text" name="receiverAccountNumber" class="form-control" required placeholder="e.g. 100002">
                </div>
                <div class="mb-3">
                    <label class="form-label">Amount (LKR)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" required placeholder="5000">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="simulateFailure" class="form-check-input" id="failCheck">
                    <label class="form-check-label" for="failCheck">Simulate System Failure (Test Rollback)</label>
                </div>
                <button type="submit" class="btn btn-primary">Submit Transfer</button>
            </form>
        </div>
    </div>

<form action="/" method="get" style="margin-bottom: 20px;">
    <input type="text" name="keyword" placeholder="Search customer name..." style="padding: 5px;">
    <button type="submit" style="padding: 5px 10px;">Search</button>
</form>

</body>
</html>
